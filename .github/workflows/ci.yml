name: CI

# Everything here is free: no model calls, no AWS, no API keys.
# That is deliberate — see docs/architecture/environment-strategy.md.
# Live-provider checks, when they exist, go in a separate opt-in workflow.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --directory projects/ludo/engine-python

      - name: Tests
        run: uv run --directory projects/ludo/engine-python pytest

      - name: Cross-engine conformance vectors
        # Guards ADR-0002. A failure here means engine behaviour changed —
        # never "fix" it by regenerating the vectors.
        run: uv run --directory projects/ludo/engine-python python -m ludo_engine.cli conformance --check

      - name: Validate recorded transcripts against the shared schema
        run: uv run --directory projects/ludo/engine-python python -m ludo_engine.cli validate "../games/*.jsonl"

      - name: Strands stack
        # Its own venv, never shared with the LangGraph stack. No model calls:
        # everything runs against the scripted client.
        run: |
          uv sync --directory projects/ludo/stack-strands
          uv run --directory projects/ludo/stack-strands pytest

      - name: LangGraph stack
        # The other Python venv — resolved separately on purpose, so the two
        # frameworks can disagree about every transitive dependency. Scripted
        # only, like everything in this workflow.
        run: |
          uv sync --directory projects/ludo/stack-langgraph
          uv run --directory projects/ludo/stack-langgraph pytest

      - name: Eval harness
        # Consumes the committed transcripts only — its fold self-verifies
        # against game_ended, so this step also cross-checks every fixture.
        run: |
          uv sync --directory projects/ludo/eval
          uv run --directory projects/ludo/eval pytest

  alibi:
    name: ALIBI (Python side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Engine tests
        run: |
          uv sync --directory projects/alibi/engine-python
          uv run --directory projects/alibi/engine-python pytest

      - name: Cross-engine conformance vectors
        # Corpus bytes included — the archive rides in the transcript, so a
        # template drift IS a conformance failure. Never regenerate to pass.
        run: uv run --directory projects/alibi/engine-python python -m alibi_engine.cli conformance --check

      - name: Validate recorded transcripts against the shared schema
        run: uv run --directory projects/alibi/engine-python python -m alibi_engine.cli validate "../games/*.jsonl"

      - name: Strands stack
        run: |
          uv sync --directory projects/alibi/stack-strands
          uv run --directory projects/alibi/stack-strands pytest

      - name: LangGraph stack
        run: |
          uv sync --directory projects/alibi/stack-langgraph
          uv run --directory projects/alibi/stack-langgraph pytest

      - name: Eval harness
        # Deterministic only — ground truth exists. Its spine check proves the
        # three committed fixtures tell one story.
        run: |
          uv sync --directory projects/alibi/eval
          uv run --directory projects/alibi/eval pytest

  alibi-java:
    name: ALIBI (Java side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Engine tests
        # ConformanceTest replays all 20 shared vectors, generated prose and
        # all — the two-language corpus generator's whole guarantee.
        working-directory: projects/alibi/engine-java
        run: ./mvnw -B test

      - name: Install the engine locally
        working-directory: projects/alibi/engine-java
        run: ./mvnw -q -B install -DskipTests

      - name: Spring AI stack
        working-directory: projects/alibi/stack-springai
        run: ./mvnw -B test

  alibi-ui:
    name: ALIBI UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/alibi/ui/package-lock.json

      - name: Install
        working-directory: projects/alibi/ui
        run: npm ci

      - name: Tests
        # ADR-0007's rules, third application, plus ALIBI's own seal rule:
        # the solution and the red herrings never render before game_ended.
        working-directory: projects/alibi/ui
        run: npx vitest run

      - name: Static build
        working-directory: projects/alibi/ui
        run: npm run build

  engine-java:
    name: Java engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        # Includes ConformanceTest, which replays all 20 shared vectors — the
        # same ones the Python engine is held to. The two engines agreeing is
        # the entire premise of ADR-0002; a failure here means they have
        # drifted, and the fix is never to regenerate the vectors.
        working-directory: projects/ludo/engine-java
        run: ./mvnw -B test

      - name: Install the engine locally
        # The Spring AI stack depends on the engine by coordinates — the JVM's
        # arranged-deliberately equivalent of Python's path dependency.
        working-directory: projects/ludo/engine-java
        run: ./mvnw -q -B install -DskipTests

      - name: Spring AI stack
        # Scripted only: the fake model implements Spring AI's own ChatModel
        # seam, so no keys and no cost — same rule as every other job here.
        working-directory: projects/ludo/stack-springai
        run: ./mvnw -B test

  docs:
    name: Docs and shared contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Links, anchors, mermaid structure
        # Structure only. Whether the prose is still TRUE is on the author —
        # see Rule #1 in CLAUDE.md.
        run: python scripts/check_docs.py

      - name: Install the mermaid parser
        run: npm ci

      - name: Mermaid blocks actually render
        # The structural check above catches the mistakes we already know about.
        # This one hands every block to mermaid's own parser, which is the only
        # thing that can answer "does this diagram render". We added it after
        # shipping a diagram with a node called `call` — a click-callback
        # directive, not a node id — and hearing about it from a reader.
        run: node scripts/check_mermaid.mjs

      - name: Prompt set and model config invariants
        # Guards ADR-0005 (one model on both routes) and the parity rules that
        # make the three-stack comparison mean anything. Every check here
        # protects something that fails SILENTLY — no crash, just a result that
        # quietly isn't what it claims. uv resolves pyyaml from the script's
        # own PEP 723 header; nothing to install.
        run: uv run scripts/check_prompts.py

  ui:
    name: UI transcript player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/ludo/ui/package-lock.json

      - name: Install
        working-directory: projects/ludo/ui
        run: npm ci

      - name: Tests
        # ADR-0007's fixture rules, mechanised: every transcript in
        # projects/ludo/games/ must render; the zero-agent-event fixture is a
        # first-class citizen; `stack` is displayed, never branched on
        # (enforced by a mutation-diff test); and the projector's replay must
        # agree with the engine's own game_ended standings. Adding a stack
        # means adding its transcript to games/ — and must NOT require
        # touching UI source.
        working-directory: projects/ludo/ui
        run: npx vitest run

      - name: Static build
        working-directory: projects/ludo/ui
        run: npm run build
