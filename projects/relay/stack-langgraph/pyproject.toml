[project]
name = "relay-langgraph"
version = "0.1.0"
description = "RELAY on LangGraph — runner agents on checkpointer threads, one shared anchor model."
readme = "README.md"
license = "Apache-2.0"
# Pinned, not a range. Both Python stacks run the SAME interpreter so it cannot
# become a variable in the comparison — see docs/open-questions.md #8.
requires-python = "==3.12.*"

dependencies = [
    # No graph to draw this time. RELAY has no protocol between runners, so the
    # StateGraph that carried LUDO's negotiation table has nothing to carry —
    # each lane is the framework's own single-agent loop. That absence is the
    # finding, not an omission.
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "pyyaml>=6.0",
    "relay-engine",
]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[tool.uv.sources]
# A path dependency, NOT a workspace member — the two Python stacks must never
# share a lockfile or venv (environment-strategy.md).
relay-engine = { path = "../engine-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
