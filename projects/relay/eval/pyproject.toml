[project]
name = "relay-eval"
version = "0.1.0"
description = "RELAY evaluation — deterministic scoring against the sealed difficulty. No judge."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# Transcripts only. No engine, no framework, no keys — the eval must run
# against a committed .jsonl and nothing else (ADR-0003).
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
