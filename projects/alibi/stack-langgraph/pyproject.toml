[project]
name = "alibi-langgraph"
version = "0.1.0"
description = "ALIBI agent harness built on LangChain's LangGraph - detectives with an archivist tool."
readme = "README.md"
license = "Apache-2.0"
# Pinned, not a range. Both Python stacks run the SAME interpreter so it cannot
# become a variable in the comparison - see docs/open-questions.md #8.
requires-python = "==3.12.*"

dependencies = [
    # No langgraph-swarm question this time: answered question 22 removed
    # negotiation from ALIBI entirely, so there is no multi-agent protocol to
    # carry. Each detective is the framework's own create_agent loop with the
    # archivist tool - which is itself the finding: ALIBI stresses tools and
    # retrieval, not orchestration.
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "pyyaml>=6.0",
    "alibi-engine",
]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[tool.uv.sources]
# A path dependency, NOT a workspace member - the two Python stacks must never
# share a lockfile or venv (environment-strategy.md).
alibi-engine = { path = "../engine-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alibi_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
