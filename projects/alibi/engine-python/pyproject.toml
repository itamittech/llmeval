[project]
name = "alibi-engine"
version = "0.1.0"
description = "Deterministic ALIBI deduction engine and case generator. Standard library only — no LLM dependencies."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed to validate transcripts against the shared JSON Schema.
validate = ["jsonschema>=4.21"]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alibi_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
