[project]
name = "alibi-eval"
version = "0.1.0"
description = "Deterministic evaluation for ALIBI transcripts. Consumes event streams only - no keys, no cost."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alibi_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
