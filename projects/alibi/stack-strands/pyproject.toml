[project]
name = "alibi-strands"
version = "0.1.0"
description = "ALIBI agent harness built on the Strands Agents SDK - detectives with an archivist tool."
readme = "README.md"
license = "Apache-2.0"
# Pinned, not a range. Both Python stacks run the SAME interpreter so it cannot
# become a variable in the comparison - see docs/open-questions.md #8.
requires-python = "==3.12.*"

dependencies = [
    # Same pin discipline as the LUDO stack; the anthropic extra carries the
    # direct-route provider for live play and the (live-tier) archivist.
    "strands-agents[anthropic]>=1.50",
    "pyyaml>=6.0",
    "alibi-engine",
]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[tool.uv.sources]
# A path dependency, NOT a workspace member - the two Python stacks must never
# share a lockfile or venv (environment-strategy.md).
alibi-engine = { path = "../engine-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alibi_strands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
