[project]
name = "ludo-strands"
version = "0.1.0"
description = "LUDO agent harness built on the Strands Agents SDK."
readme = "README.md"
license = "Apache-2.0"
# Pinned, not a range. Both Python stacks run the SAME interpreter so it cannot
# become a variable in the comparison — see docs/open-questions.md #8.
requires-python = "==3.12.*"

dependencies = [
    # The `anthropic` extra is required, not optional: ADR-0005's control needs
    # the SAME model on both routes, and Bedrock is built in while the direct
    # Anthropic API provider lives behind this extra.
    "strands-agents[anthropic]>=1.50",
    "pyyaml>=6.0",
    "ludo-engine",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# A path dependency, NOT a workspace member. A uv workspace would give the two
# Python stacks one shared lockfile and one shared venv, which is exactly what
# environment-strategy.md forbids: the stacks must be able to disagree about
# every transitive dependency except the engine.
ludo-engine = { path = "../engine-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ludo_strands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
