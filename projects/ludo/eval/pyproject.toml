[project]
name = "ludo-eval"
version = "0.1.0"
description = "LUDO evaluation harness: deterministic scoring + LLM-as-judge over recorded transcripts."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"

# Deliberately tiny, and deliberately missing two things:
# - no engine import: the eval consumes transcripts ONLY (ADR-0003). If it
#   ever needs an arrow into the engine, something is bypassing the stream.
# - no stack imports and no LLM SDK yet: layer 1 is model-free, and the live
#   judge is blocked on its model id like every live call in this repo. The
#   judge seam exists; the OpenAI client arrives with the id.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ludo_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
