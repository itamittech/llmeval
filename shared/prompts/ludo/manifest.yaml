# The prompt set every stack loads. Data, not code — see repository-layout.md.
#
# A stack reads this file, concatenates the `system` templates in order to build
# the system prompt, and renders one `turn` template per step of the turn
# protocol. Substitution is literal `{{name}}` replacement; there is no template
# logic, deliberately (see README.md).
#
# `variables` is the contract: check_prompts.py fails if a template uses a
# variable not listed here, or lists one it never uses.

# version 2: negotiation redesigned as a floor-passing table conversation to fit
# the swarm orchestrator (ADR-0009). v1 transcripts are historical, not comparable.
version: 2
game: ludo

# Concatenated in this order, once per game. Never varies within a game, which
# is what makes it prompt-cacheable.
system:
  - file: system/identity.md
    variables: [color]

  - file: system/rules.md
    variables: []

  - file: system/negotiation.md
    variables: [max_floor_passes, max_message_chars]

# Rendered fresh each time. Never cached.
turn:
  # The shared half of the negotiation phase: one render, shown to every player
  # activated in the conversation. Global facts only — anything per-agent
  # belongs in `briefing`.
  negotiate:
    file: turn/negotiate.md
    variables: [turn, active, board, standings]

  # The per-agent half: seeded into each agent's own context at phase start,
  # before the conversation begins. Private — carries that agent's memory and
  # the messages addressed to it since its last turn.
  briefing:
    file: turn/briefing.md
    variables: [color, inbox, memory]

  decide:
    file: turn/decide.md
    variables: [turn, color, die, board, legal_moves, recent_events, memory]

  # Sent only after the engine rejects a move. The engine allows two attempts
  # before forfeiting the turn (MOVE_ATTEMPTS), so this fires at most once.
  retry:
    file: turn/retry.md
    variables: [reason, rejected, legal_moves]

  reflect:
    file: turn/reflect.md
    variables: [turn, color, turn_summary, memory]
