# Which model sits in which seat, and how it is reached.
#
# NO SECRETS. This file is public and committed. It names environment
# variables; it never contains their values.
#
# Seats are numbered, not coloured, because the seat -> colour assignment
# rotates between games (ADR-0006). Turn order in Ludo is an advantage, and a
# fixed mapping would bake it permanently into the model comparison.
#
# The control: seats 1 and 3 run the SAME model over DIFFERENT routes, so any
# difference between them is attributable to the route rather than the model
# (ADR-0005). check_prompts.py fails if that pairing is ever broken — comparing
# with the `anthropic.` Bedrock prefix stripped, since the same model is spelled
# differently on the two routes.
#
# Model ids here are NOT dated snapshots. Current Claude ids (`claude-opus-5`,
# `claude-sonnet-5`) are complete as written and have no dated variant —
# appending a date 404s. Reproducibility therefore comes from recording the
# model the API actually served in `game_started`, not from pinning a date here.

version: 1

# Pinned explicitly, because Strands, LangGraph and Spring AI do not share
# defaults. Leaving these to the framework would be a silent parity break.
#
# But sampling is NOT uniformly pinnable, and pretending otherwise would be a
# lie in config form: the Claude 5 family REJECTS temperature / top_p / top_k
# with a 400 and controls depth with `effort` instead, while Nova and DeepSeek
# take the sampling parameters and have no effort knob. So each provider pins
# what it actually has.
#
# This does NOT weaken the ADR-0005 control: seats 1 and 3 are the same model
# with the same settings, so the route comparison is unaffected. What it costs
# is the broader claim that all four seats are configured identically — which
# was never a controlled comparison anyway. Recorded as a capability-matrix
# finding rather than left as a silent assumption.
inference:
  # Honoured by every provider.
  max_output_tokens: 2000

  anthropic:
    effort: medium          # low | medium | high | xhigh | max
    thinking: adaptive      # on by default on Claude 5; counts against max_output_tokens
    thinking_display: summarized   # raw chain of thought is never returned

  amazon:
    temperature: 0.7
    top_p: 1.0

  deepseek:
    temperature: 0.7
    top_p: 1.0

credentials:
  bedrock: [AWS_REGION, AWS_PROFILE]
  anthropic: [ANTHROPIC_API_KEY]
  deepseek: [DEEPSEEK_API_KEY]
  openai: [OPENAI_API_KEY]

profiles:
  # Cheap and fast. For proving the harness works end to end — which will take
  # many runs before it takes one good one.
  dev:
    budgets:
      max_turns: 40
      # Floor passes per negotiation phase (ADR-0009) — the swarm orchestrator's
      # handoff cap. Each pass is one agent activation, i.e. one model call.
      max_floor_passes: 3
      max_message_chars: 240
      # Per-agent conversation budget (harness-contract §5). When an agent's
      # running conversation exceeds this, the oldest exchanges are summarised
      # into memory and dropped. Provisional, like every number here.
      max_context_tokens: 6000
      max_tokens_per_game: 150000
    seats:
      - seat: 1
        access: bedrock
        provider: anthropic
        model: anthropic.claude-sonnet-5    # Bedrock ids take the `anthropic.` prefix
      - seat: 2
        access: bedrock
        provider: amazon
        model: TBD          # Amazon Nova, small tier
      - seat: 3
        access: direct
        provider: anthropic
        model: claude-sonnet-5              # SAME model as seat 1  <- the control
      - seat: 4
        access: direct
        provider: deepseek
        model: TBD
    judge:
      access: direct
      provider: openai
      model: TBD            # reasoning model; must not be a family that played

  # The run people actually watch.
  headline:
    budgets:
      max_turns: 60
      max_floor_passes: 6
      max_message_chars: 400
      max_context_tokens: 30000
      max_tokens_per_game: 600000
    seats:
      - seat: 1
        access: bedrock
        provider: anthropic
        model: anthropic.claude-opus-5
      - seat: 2
        access: bedrock
        provider: amazon
        model: TBD
      - seat: 3
        access: direct
        provider: anthropic
        model: claude-opus-5                # SAME model as seat 1  <- the control
      - seat: 4
        access: direct
        provider: deepseek
        model: TBD
    judge:
      access: direct
      provider: openai
      model: TBD

# --- ALIBI (project two, ADR-0010) -----------------------------------------
# Same seats, same judge discipline, same ADR-0005 control: the four detectives
# are the four seats above, per profile. Only what ALIBI adds is configured here.
alibi:
  budgets:
    # Derived from the 500-game bench (game-rules.md "The numbers"): median 21,
    # p99 45 turns to a solve. dev sits just above the median so cheap runs
    # mostly end mid-game — belief scoring covers that; headline sits above the
    # benched p99, so an unsolved full game is the detectives' fault, not the cap's.
    dev:
      max_turns: 24
      max_searches_per_turn: 2
      max_note_chars: 240
      max_tokens_per_game: 120000
    headline:
      max_turns: 48
      max_searches_per_turn: 2
      max_note_chars: 400
      max_tokens_per_game: 500000
  # The archivist is one shared instrument serving all four seats identically —
  # a records clerk with citations over 3 retrieved documents, not a scorer, so
  # the judge's family-conflict rule does not apply. The small Anthropic tier is
  # chosen for cost; recorded here so the choice is visible and attackable.
  # The scripted tier never calls it: bots and scripted models use the engine's
  # baseline retriever directly.
  archivist:
    provider: anthropic
    access: direct
    model: claude-haiku-4-5-20251001
    retrieval_profile: baseline   # engine keyword retriever; embedding profiles are live-tier (question 23)

# --- RELAY (project three, ADR-0011) ---------------------------------------
# The first game in this repo that does NOT use the four seats above. Its
# runners are small models on local hardware, so "seat" and "access route" mean
# something different: a lane, and whether the weights are on this machine.
#
# ADR-0005's control moves down a tier with them. Lanes 1 and 3 run the SAME
# small model, one locally and one hosted, so the question "what does running
# it at the edge actually buy?" is answerable rather than confounded with a
# model change. check_prompts.py fails if that pairing is broken.
#
# Note what is NOT TBD here: the anchor. RELAY needs no undecided model id, and
# that is why it is the one project that could be played today.
relay:
  budgets:
    # Sized by the sweep and the 500-game bench (game-rules.md "The numbers").
    # A generous cap is cheap in this game: runner calls are local and free, so
    # the paid surface is the quota — 8 anchor calls — however long the race
    # runs. That is why headline sits above the WEAKEST profile's p99 (101)
    # rather than the middling one's.
    dev:
      max_turns: 48
      escalation_quota: 8
      max_note_chars: 240
      max_tokens_per_game: 120000
    headline:
      max_turns: 104
      escalation_quota: 8
      max_note_chars: 400
      max_tokens_per_game: 400000

  # The one shared frontier model escalation routes to. A model, not an agent:
  # it is handed a stage prompt, given no memory and no tools, and asked once.
  # Pinned, not TBD — it is the Anthropic model already pinned for LUDO.
  anchor:
    provider: anthropic
    access: direct
    model: claude-sonnet-5

  # Three small open-weight families across four lanes. Ids and quantisation
  # are the live-tier decision (question 26) — the SHAPE is settled here, and
  # the scripted tier needs no ids at all.
  lanes:
    - lane: 1
      access: local
      provider: meta
      model: llama-small           # <- the control, run on this machine
      quantisation: TBD
    - lane: 2
      access: local
      provider: alibaba
      model: qwen-small
      quantisation: TBD
    - lane: 3
      access: bedrock
      provider: meta
      model: meta.llama-small      # SAME model as lane 1  <- the control, hosted
    - lane: 4
      access: local
      provider: google
      model: gemma-small
      quantisation: TBD
